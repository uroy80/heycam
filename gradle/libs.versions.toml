# heycam version catalog (binding for MVP). Rule: newest stable >= 14 days old on 2026-10-20,
# taken from research/toolchain/versions.json unless noted. Dependabot (14-day cooldown) moves it later.

[versions]
agp = "9.4.1"                       # 2026-09-18
kotlin = "2.4.20"                   # 2026-09-07 (KGP on root buildscript classpath; compose compiler plugin same version)
ksp = "2.3.12"                      # 2026-09-09
composeBom = "2026.09.00"           # ui 1.12.1, material3 1.4.0, adaptive 1.3.0
coreKtx = "1.19.1"
activity = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.2"               # type-safe Navigation Compose
room3 = "3.0.3"
sqlite = "2.7.1"                    # androidx.sqlite:sqlite-bundled (FTS5 + trigram)
datastore = "1.2.1"
hilt = "2.60.1"
androidxHilt = "1.4.0"
kotlinxSerialization = "1.11.0"
coroutines = "1.11.0"
coil = "3.6.3"
splashscreen = "1.2.0"
profileinstaller = "1.4.1"
documentfile = "1.1.0"
pdfboxAndroid = "2.0.27.0"          # unmaintained since 2023; BouncyCastle excluded
# ML Kit
mlkitDocScanner = "16.0.0"
mlkitTextUnbundledLatin = "19.0.1"
mlkitTextUnbundledScripts = "16.0.1"
mlkitTextBundled = "16.0.1"         # fallback only if gate G1 fails
# v1.1 (declared now so versions are reviewed once)
gmsCodeScanner = "16.1.0"
biometric = "1.1.0"                 # re-check 1.4.0 stability at v1.1
glance = "1.2.0"
# tests
junit = "4.13.2"
robolectric = "4.17"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestRules = "1.7.0"
androidxTestExtJunit = "1.3.0"
espresso = "3.7.0"
uiautomator = "2.4.0"
turbine = "1.2.1"
truth = "1.4.5"
roborazzi = "1.76.0"                # 2026-09-29; gate G4

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
