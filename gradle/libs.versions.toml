mlkit-document-scanner = { module = "com.google.android.gms:play-services-mlkit-document-scanner", version.ref = "mlkitDocScanner" }
mlkit-text-latin = { module = "com.google.android.gms:play-services-mlkit-text-recognition", version.ref = "mlkitTextUnbundledLatin" }
